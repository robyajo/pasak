# =============================================================================
#  Nginx — Situs Dokumentasi Laravel Security Monitor (Astro, statis)
#  Proyek/repo terpisah:  web/  (berdiri sendiri, bukan bagian runtime paket)
# =============================================================================
#
#  Menyajikan hasil build statis (folder `dist/`) di AKAR domainnya sendiri:
#      https://docs.example.com/
#
#  Tata letak di VPS:
#      /var/www/laravel-security-monitor-docs/      <-- isi folder `dist/`
#      ├── index.html
#      ├── 404.html
#      ├── _astro/                                  <-- aset ber-hash
#      ├── pagefind/                                <-- indeks pencarian
#      └── getting-started/ ... dst
#
#  Astro dikonfigurasi TANPA `base` (disajikan di akar). Lihat astro.config.mjs.
#
#  Langkah deploy:
#      1) Di mesin lokal:
#           cd web
#           npm ci
#           npm run build
#      2) Unggah ke VPS (rsync menghapus berkas lama agar tetap sinkron):
#           rsync -a --delete dist/ user@<vps>:/var/www/laravel-security-monitor-docs/
#      3) Di VPS:
#           sudo cp nginx.conf /etc/nginx/sites-available/laravel-security-monitor-docs
#           sudo ln -s /etc/nginx/sites-available/laravel-security-monitor-docs /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#      4) Sertifikat TLS (Let's Encrypt) — setelah DNS mengarah ke VPS:
#           sudo certbot --nginx -d docs.example.com
#
#  Ganti seluruh "docs.example.com" dengan domain/subdomain Anda.
#  Berkas ini adalah potongan `server { ... }` (konteks http), sehingga
#  `mime.types` bawaan nginx sudah aktif.
# =============================================================================


# --- Kompresi (konteks http; aman diulang di sini) --------------------------
gzip            on;
gzip_vary       on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied    any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;


# =============================================================================
#  HTTP :80  ->  redirect ke HTTPS (+ jalur ACME untuk certbot)
# =============================================================================
server {
    listen      [::]:80;
    listen      80;
    server_name docs.example.com;

    # Biarkan certbot memverifikasi domain sebelum redirect permanen aktif.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
#  HTTPS :443  (blok utama — menyajikan situs di akar domain)
# =============================================================================
server {
    listen      [::]:443 ssl http2;
    listen      443 ssl http2;
    # Catatan: pada nginx >= 1.25.1, `http2` pada `listen` sudah usang; gunakan
    #           `listen 443 ssl;` lalu tambahkan baris `http2 on;`.

    server_name docs.example.com;

    # --- Sertifikat TLS (Let's Encrypt) ---
    ssl_certificate         /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/docs.example.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # --- Header keamanan (diwariskan ke seluruh lokasi di bawah) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;
    charset       utf-8;

    # --- Akar dokumen & log ---
    root  /var/www/laravel-security-monitor-docs;
    index index.html;

    access_log /var/log/nginx/laravel-security-monitor-docs.access.log;
    error_log  /var/log/nginx/laravel-security-monitor-docs.error.log warn;

    # HTML tidak di-cache lama; lokasi aset di bawah akan menimpanya.
    expires -1;

    # --- Halaman 404 kustom dari Astro ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --- Aset ber-hash (boleh di-cache sangat lama) ---
    location /_astro/ {
        try_files $uri =404;
        expires   1y;
        access_log off;
    }

    # --- Indeks pencarian Pagefind ---
    location /pagefind/ {
        try_files $uri =404;
        expires   7d;
        access_log off;
    }

    # --- Situs dokumentasi (statis) ---
    # `$uri/` melayani index.html untuk URL berakhiran "/" (gaya Astro).
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # --- Kecilkan noise log & blokir berkas tersembunyi ---
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known) { deny all; }
}


# =============================================================================
#  ALTERNATIF — menyajikan pada SUB-PATH (mis. https://example.com/docs/)
# =============================================================================
#
#  Hanya jika Anda perlu berbagi domain dengan situs lain. Langkahnya:
#    1) Pada astro.config.mjs tambahkan `base: '/docs'`, lalu build ulang.
#    2) Letakkan isi `dist/` di dalam sub-folder yang namanya sama dengan base:
#         /var/www/laravel-security-monitor-docs/docs/   <-- isi `dist/`
#    3) Gunakan `root` + lokasi berikut (ganti bagian lokasi di blok utama):
#
#    location = /docs        { return 301 /docs/; }
#    location /docs/_astro/  { try_files $uri =404; expires 1y; access_log off; }
#    location /docs/pagefind/{ try_files $uri =404; expires 7d; access_log off; }
#    location /docs/         { try_files $uri $uri/ $uri/index.html =404; }
#    error_page 404 /docs/404.html;
#    location = /docs/404.html { internal; }
# =============================================================================
